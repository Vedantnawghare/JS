
<!DOCTYPE html>
<html>
<head>
    <title>JSON Data Viewer</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(120deg, #dbeafe, #ede9fe);
            padding: 30px;
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 900px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0002;
        }

        h2 {
            color: #4338ca;
        }

        button {
            padding: 11px 18px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .fetch-btn { background: #2563eb; }
        .jquery-btn { background: #7c3aed; }

        input {
            padding: 11px;
            width: 60%;
            border: 1px solid #aaa;
            border-radius: 6px;
            margin: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #4338ca;
            color: white;
        }

        tr:nth-child(even) {
            background: #eef2ff;
        }

        #message {
            color: #059669;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>JSON Data Viewer</h2>
    <p>Fetch API and jQuery AJAX Example</p>

    <button class="fetch-btn" onclick="loadFetch()">
        Load using Fetch
    </button>

    <button class="jquery-btn" onclick="loadJQuery()">
        Load using jQuery
    </button>

    <br>

    <input type="text" id="search"
        placeholder="Search by name or email..."
        oninput="searchUsers()">

    <p id="message">Click a button to load data.</p>

    <h3 id="count">Total Users: 0</h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Company</th>
            </tr>
        </thead>

        <tbody id="tableBody">
            <tr>
                <td colspan="5">No data available</td>
            </tr>
        </tbody>
    </table>

</div>

<script>

    // JSON API URL
    const url = "https://jsonplaceholder.typicode.com/users";

    let allUsers = [];

    // Common function to display data
    function displayUsers(users) {

        let table = document.getElementById("tableBody");

        table.innerHTML = "";

        users.forEach(function(user) {

            let row = table.insertRow();

            row.insertCell().textContent = user.id;
            row.insertCell().textContent = user.name;
            row.insertCell().textContent = user.email;
            row.insertCell().textContent = user.address.city;
            row.insertCell().textContent = user.company.name;

        });

        if (users.length === 0) {
            table.innerHTML =
                "<tr><td colspan='5'>No records found</td></tr>";
        }

        document.getElementById("count").innerText =
            "Total Users: " + users.length;
    }


    // METHOD 1: Fetch API
    async function loadFetch() {

        document.getElementById("message").innerText =
            "Loading data...";

        try {

            let response = await fetch(url);

            if (!response.ok) {
                throw new Error("Failed to load data");
            }

            let data = await response.json();

            allUsers = data;

            displayUsers(allUsers);

            document.getElementById("message").innerText =
                "Data loaded successfully using Fetch API!";

        }
        catch(error) {

            document.getElementById("message").innerText =
                "Error loading data: " + error.message;

        }
    }


    // METHOD 2: jQuery getJSON
    function loadJQuery() {

        document.getElementById("message").innerText =
            "Loading data...";

        $.getJSON(url, function(data) {

            allUsers = data;

            displayUsers(allUsers);

            document.getElementById("message").innerText =
                "Data loaded successfully using jQuery!";

        }).fail(function() {

            document.getElementById("message").innerText =
                "Error loading JSON data!";

        });
    }


    // Search functionality
    function searchUsers() {

        let search = document.getElementById("search")
            .value.toLowerCase();

        let filtered = allUsers.filter(function(user) {

            return user.name.toLowerCase().includes(search) ||
                   user.email.toLowerCase().includes(search);

        });

        displayUsers(filtered);
    }

</script>

</body>
</html>
