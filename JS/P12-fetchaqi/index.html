
<!DOCTYPE html>
<html>
<head>
    <title>AirPulse - Air Quality App</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(120deg, #141e30, #243b55);
            text-align: center;
            padding: 30px;
            color: white;
        }

        .container {
            background: white;
            color: #333;
            max-width: 550px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        h2 { color: #0891b2; }

        select, button {
            padding: 10px;
            margin: 8px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #0891b2;
            color: white;
            cursor: pointer;
        }

        .data {
            background: #e0f2fe;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }

        .data h2 { color: #0369a1; }

        #status { color: green; }

        @media(max-width: 450px) {
            .container { width: 90%; padding: 12px; }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>AirPulse 🌍</h2>
    <p>Real-Time Air Quality Monitor</p>

    <form id="cityForm">

        <select id="city">
            <option>New Delhi</option>
            <option>Mumbai</option>
            <option>London</option>
            <option>Tokyo</option>
        </select>

        <button type="submit">Check AQI</button>

    </form>

    <button id="saveBtn">Save Favourite ⭐</button>

    <h3 id="cityName">Air Quality Data</h3>

    <div class="data">
        <h2 id="aqi">--</h2>
        Air Quality Index
    </div>

    <div class="data">
        PM2.5: <b id="pm25">--</b>
    </div>

    <div class="data">
        PM10: <b id="pm10">--</b>
    </div>

    <p id="status">Loading data...</p>

    <h3>Favourite Cities</h3>
    <div id="favorites"></div>

</div>

<script>

$(document).ready(function() {

    // City coordinates
    const cities = {
        "New Delhi": [28.61, 77.20],
        "Mumbai": [19.07, 72.87],
        "London": [51.50, -0.12],
        "Tokyo": [35.67, 139.65]
    };

    let currentCity = "";

    // Display saved favourites
    function showFavorites() {

        let favs = JSON.parse(
            localStorage.getItem("favorites") || "[]"
        );

        $("#favorites").empty();

        favs.forEach(function(city) {
            $("#favorites").append(
                $("<button>").text(city).attr("data-city", city)
            );
        });
    }

    // AJAX request
    function loadData(city) {

        currentCity = city;

        $.ajax({
            url: "https://air-quality-api.open-meteo.com/v1/air-quality",

            method: "GET",

            dataType: "json",

            data: {
                latitude: cities[city][0],
                longitude: cities[city][1],
                current: "european_aqi,pm2_5,pm10"
            },

            success: function(data) {

                $("#cityName").text(city);

                $("#aqi").text(data.current.european_aqi);
                $("#pm25").text(data.current.pm2_5);
                $("#pm10").text(data.current.pm10);

                $("#status").text(
                    "Updated: " + new Date().toLocaleTimeString()
                );

                localStorage.setItem("lastCity", city);
            },

            error: function() {
                $("#status").text("Error loading data!");
            }
        });
    }

    // Submit event
    $("#cityForm").on("submit", function(e) {

        e.preventDefault();

        loadData($("#city").val());

    });

    // Save favourite
    $("#saveBtn").on("click", function() {

        let favs = JSON.parse(
            localStorage.getItem("favorites") || "[]"
        );

        if (!favs.includes(currentCity)) {
            favs.push(currentCity);
            localStorage.setItem("favorites", JSON.stringify(favs));
        }

        showFavorites();
    });

    // Click favourite city
    $("#favorites").on("click", "button", function() {

        let city = $(this).attr("data-city");

        $("#city").val(city);

        loadData(city);
    });

    // Initial data
    showFavorites();

    let last = localStorage.getItem("lastCity") || "New Delhi";

    $("#city").val(last);

    loadData(last);

    // Auto refresh every 30 seconds
    setInterval(function() {
        loadData(currentCity);
    }, 30000);

});

</script>

</body>
</html>
