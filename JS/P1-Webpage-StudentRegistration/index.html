
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Portal</title>

    <!-- CSS SECTION -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1, h2 {
            text-align: center;
            color: #174a7e;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .gender {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #174a7e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d3155;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f8f0;
            border-radius: 8px;
        }

        #result p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <!-- HTML SECTION -->
    <div class="container">

        <h1>SIT Nagpur</h1>
        <h2>Student Registration Portal</h2>

        <form id="registrationForm">

            <label>Full Name:</label>
            <input type="text" id="name" required>

            <label>Age:</label>
            <input type="number" id="age" min="1" required>

            <label>PRN Number:</label>
            <input type="text" id="prn" required>

            <label>Phone Number:</label>
            <input type="tel" id="phone" pattern="[0-9]{10}" 
                   maxlength="10" required>

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Department:</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>

            <label>Semester:</label>
            <select id="semester" required>
                <option value="">Select Semester</option>
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
            </select>

            <label>Gender:</label>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <label>Address:</label>
            <textarea id="address" rows="3" required></textarea>

            <button type="submit">Submit Registration</button>

        </form>

        <!-- Registration Details -->
        <div id="result">
            <h2>Registration Details</h2>
            <div id="details"></div>
        </div>

    </div>


    <!-- JAVASCRIPT SECTION -->
    <script>

        // Display message in console
        console.log("Student Registration Portal Loaded");

        // Using console methods
        console.info("Welcome to SIT Nagpur");
        console.warn("Please enter correct student details");

        // Registration form event
        document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            // Getting student information
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let prn = document.getElementById("prn").value;
            let phone = document.getElementById("phone").value;
            let email = document.getElementById("email").value;
            let department = document.getElementById("department").value;
            let semester = document.getElementById("semester").value;
            let gender = document.querySelector(
                'input[name="gender"]:checked'
            ).value;
            let address = document.getElementById("address").value;

            // Welcome popup
            alert("Welcome to SIT Nagpur, " + name +
                  "\nRegistration Successful!");

            // Display registration details
            document.getElementById("details").innerHTML =
                "<p><b>Name:</b> " + name + "</p>" +
                "<p><b>Age:</b> " + age + "</p>" +
                "<p><b>PRN:</b> " + prn + "</p>" +
                "<p><b>Phone:</b> " + phone + "</p>" +
                "<p><b>Email:</b> " + email + "</p>" +
                "<p><b>Department:</b> " + department + "</p>" +
                "<p><b>Semester:</b> " + semester + "</p>" +
                "<p><b>Gender:</b> " + gender + "</p>" +
                "<p><b>Address:</b> " + address + "</p>";

            document.getElementById("result").style.display = "block";

            // Console output
            console.log("Registration Successful!");
            console.table({
                Name: name,
                Age: age,
                PRN: prn,
                Phone: phone,
                Email: email,
                Department: department,
                Semester: semester,
                Gender: gender,
                Address: address
            });

        });

    </script>

</body>
</html>
