
<!DOCTYPE html>
<html>
<head>
    <title>Billing Calculator</title>

    <!-- CSS SECTION -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1, h2 {
            text-align: center;
            color: #174a7e;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #174a7e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d3155;
        }

        #bill {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f8f0;
            border-radius: 8px;
        }

        #bill p {
            line-height: 1.6;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <!-- HTML SECTION -->
    <div class="container">

        <h1>Shopping Billing Calculator</h1>
        <h2>Customer Details</h2>

        <label>Customer Name:</label>
        <input type="text" id="customer" placeholder="Enter customer name">

        <label>Product Name:</label>
        <input type="text" id="product" placeholder="Enter product name">

        <label>Price per Item (₹):</label>
        <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">

        <label>Quantity:</label>
        <input type="number" id="quantity" placeholder="Enter quantity" min="1" step="1">

        <button onclick="calculateBill()">Generate Bill</button>

        <!-- BILL OUTPUT -->
        <div id="bill">
            <h2>Bill Receipt</h2>
            <div id="billDetails"></div>
        </div>

    </div>


    <!-- JAVASCRIPT SECTION -->
    <script>

        // Using var
        var shopName = "SIT Shopping Store";

        // Using const
        const GST = 18;

        // Using let
        let totalAmount = 0;

        function calculateBill() {

            // Getting user input
            let customer = document.getElementById("customer").value;
            let product = document.getElementById("product").value;
            let price = Number(document.getElementById("price").value);
            let quantity = Number(document.getElementById("quantity").value);

            // Input validation
            if (customer.trim() === "" || product.trim() === "" ||
                document.getElementById("price").value === "" ||
                document.getElementById("quantity").value === "" ||
                price < 0 || quantity <= 0) {

                alert("Please enter valid details!");
                return;
            }

            // Calculating bill
            let subtotal = price * quantity;

            let gstAmount = (subtotal * GST) / 100;

            totalAmount = subtotal + gstAmount;

            // Destructuring
            let customerDetails = [customer, product, quantity];

            let [customerName, productName, itemQuantity] = customerDetails;

            // Template literals
            let receipt = `
                <p><b>Shop Name:</b> ${shopName}</p>
                <p><b>Customer Name:</b> ${customerName}</p>
                <p><b>Product:</b> ${productName}</p>
                <p><b>Price per Item:</b> ₹${price.toFixed(2)}</p>
                <p><b>Quantity:</b> ${itemQuantity}</p>
                <hr>
                <p><b>Subtotal:</b> ₹${subtotal.toFixed(2)}</p>
                <p><b>GST (${GST}%):</b> ₹${gstAmount.toFixed(2)}</p>
                <hr>
                <p class="total">Total Amount: ₹${totalAmount.toFixed(2)}</p>
                <p>Thank you for shopping with us!</p>
            `;

            // Displaying bill
            document.getElementById("billDetails").innerHTML = receipt;

            document.getElementById("bill").style.display = "block";

            // Console output
            console.log("Billing Calculator");
            console.log("Customer:", customerName);
            console.log("Subtotal:", subtotal);
            console.log("GST:", gstAmount);
            console.log("Total:", totalAmount);

            alert(`Hello ${customerName}! Your bill has been generated.`);
        }

    </script>

</body>
</html>



























<!--
THEORY:

JavaScript is a scripting language used to make web pages interactive and dynamic. It provides features such as variables, functions, template literals, destructuring, and DOM manipulation.

1. VARIABLES IN JAVASCRIPT:

Variables are used to store data in JavaScript. There are three ways to declare variables:

a) var:
- Used to declare variables.
- Has function scope.
- Can be redeclared and updated.

Example:
var shopName = "SIT Shopping Store";

b) let:
- Used to declare block-scoped variables.
- Can be updated but cannot be redeclared in the same scope.

Example:
let totalAmount = 0;

c) const:
- Used to declare constants.
- Has block scope.
- Cannot be reassigned after declaration.

Example:
const GST = 18;


2. TEMPLATE LITERALS:

Template literals allow strings to be created using backticks (`).
They support variable interpolation using ${} and allow multiline strings.

Example:
let name = "Sanskruti";
let message = `Hello ${name}, Welcome!`;

They are used in this practical to generate the billing receipt dynamically.


3. DESTRUCTURING:

Destructuring is an ES6 feature that allows values from arrays or objects to be extracted into separate variables.

Example:
let customerDetails = ["Rahul", "Laptop", 2];

let [customerName, productName, itemQuantity] = customerDetails;

It is used to extract customer name, product name, and quantity into separate variables.


4. FUNCTIONS:

A function is a reusable block of code that performs a specific task.

In this practical, the calculateBill() function is used to retrieve user input, validate the data, calculate the bill, and display the final receipt.


5. DOM MANIPULATION:

DOM (Document Object Model) represents an HTML document as a tree of objects.

JavaScript uses DOM methods and properties to access and modify webpage elements.

Common methods and properties used:

- getElementById() : Selects an HTML element using its ID.
- value : Retrieves the value entered by the user.
- innerHTML : Inserts or modifies HTML content.
- style.display : Controls the visibility of an element.


6. USER INPUT AND TYPE CONVERSION:

The value property is used to retrieve data entered in input fields.

The Number() function converts string input into numeric values so that arithmetic operations can be performed.

Example:
let price = Number(document.getElementById("price").value);


7. INPUT VALIDATION:

Input validation ensures that the user enters correct information before performing calculations.

In this practical:
- trim() checks for empty or whitespace-only text.
- Empty fields are not accepted.
- Price cannot be negative.
- Quantity must be greater than zero.
- alert() displays an error message for invalid input.
- return stops further execution when validation fails.


8. BILL CALCULATION:

The billing calculator calculates the total cost of products using the following formulas:

Subtotal = Price per Item × Quantity

GST Amount = (Subtotal × GST Rate) / 100

Total Amount = Subtotal + GST Amount

In this practical, GST is set to 18% using the const keyword.


9. toFixed() METHOD:

The toFixed() method formats a number to a specified number of decimal places.

Example:
price.toFixed(2);

It is used to display monetary values up to two decimal places.


10. ALERT AND CONSOLE METHODS:

- alert() : Displays a popup message to the user.
- console.log() : Displays messages and calculated values in the browser console.


11. WORKING OF THE PRACTICAL:

The webpage contains a billing form where the user enters customer name, product name, price, and quantity.

When the Generate Bill button is clicked, the calculateBill() function is executed.

The program validates the entered details, calculates the subtotal, GST amount, and final total, and uses destructuring to extract customer details.

Template literals are used to generate a formatted billing receipt dynamically. The receipt is displayed on the webpage using innerHTML.

Finally, console.log() displays the billing information, and an alert message confirms successful bill generation.

Thus, the practical demonstrates JavaScript variables (var, let, const), template literals, destructuring, functions, user input handling, validation, DOM manipulation, and basic arithmetic operations.
-->
