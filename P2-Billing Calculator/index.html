
<!DOCTYPE html>
<html>
<head>
    <title>Billing Calculator</title>

    <!-- CSS SECTION -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1, h2 {
            text-align: center;
            color: #174a7e;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #174a7e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d3155;
        }

        #bill {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f8f0;
            border-radius: 8px;
        }

        #bill p {
            line-height: 1.6;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <!-- HTML SECTION -->
    <div class="container">

        <h1>Shopping Billing Calculator</h1>
        <h2>Customer Details</h2>

        <label>Customer Name:</label>
        <input type="text" id="customer" placeholder="Enter customer name">

        <label>Product Name:</label>
        <input type="text" id="product" placeholder="Enter product name">

        <label>Price per Item (₹):</label>
        <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">

        <label>Quantity:</label>
        <input type="number" id="quantity" placeholder="Enter quantity" min="1" step="1">

        <button onclick="calculateBill()">Generate Bill</button>

        <!-- BILL OUTPUT -->
        <div id="bill">
            <h2>Bill Receipt</h2>
            <div id="billDetails"></div>
        </div>

    </div>


    <!-- JAVASCRIPT SECTION -->
    <script>

        // Using var
        var shopName = "SIT Shopping Store";

        // Using const
        const GST = 18;

        // Using let
        let totalAmount = 0;

        function calculateBill() {

            // Getting user input
            let customer = document.getElementById("customer").value;
            let product = document.getElementById("product").value;
            let price = Number(document.getElementById("price").value);
            let quantity = Number(document.getElementById("quantity").value);

            // Input validation
            if (customer.trim() === "" || product.trim() === "" ||
                document.getElementById("price").value === "" ||
                document.getElementById("quantity").value === "" ||
                price < 0 || quantity <= 0) {

                alert("Please enter valid details!");
                return;
            }

            // Calculating bill
            let subtotal = price * quantity;

            let gstAmount = (subtotal * GST) / 100;

            totalAmount = subtotal + gstAmount;

            // Destructuring
            let customerDetails = [customer, product, quantity];

            let [customerName, productName, itemQuantity] = customerDetails;

            // Template literals
            let receipt = `
                <p><b>Shop Name:</b> ${shopName}</p>
                <p><b>Customer Name:</b> ${customerName}</p>
                <p><b>Product:</b> ${productName}</p>
                <p><b>Price per Item:</b> ₹${price.toFixed(2)}</p>
                <p><b>Quantity:</b> ${itemQuantity}</p>
                <hr>
                <p><b>Subtotal:</b> ₹${subtotal.toFixed(2)}</p>
                <p><b>GST (${GST}%):</b> ₹${gstAmount.toFixed(2)}</p>
                <hr>
                <p class="total">Total Amount: ₹${totalAmount.toFixed(2)}</p>
                <p>Thank you for shopping with us!</p>
            `;

            // Displaying bill
            document.getElementById("billDetails").innerHTML = receipt;

            document.getElementById("bill").style.display = "block";

            // Console output
            console.log("Billing Calculator");
            console.log("Customer:", customerName);
            console.log("Subtotal:", subtotal);
            console.log("GST:", gstAmount);
            console.log("Total:", totalAmount);

            alert(`Hello ${customerName}! Your bill has been generated.`);
        }

    </script>

</body>
</html>
